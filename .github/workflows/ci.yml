name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked toolchain
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.77.0
          cache: true
          locked: true

      - name: Check Mojo formatting
        run: |
          pixi run format
          git diff --exit-code -- src tests

      - name: Run tests
        run: pixi run test

      - name: Precompile and test package
        run: pixi run test-consumer
